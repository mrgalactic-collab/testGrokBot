<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HURDAT2 — Day-of-Year Animation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="map" role="application" aria-label="Tropical cyclone map"></div>

  <div id="loading" class="loading">Loading HURDAT2 frames…</div>

  <header class="panel header">
    <h1 id="title">HURDAT2 Composite</h1>
    <div class="basin-tabs" role="tablist" aria-label="Basin">
      <button type="button" class="basin-tab active" role="tab" aria-selected="true"
              data-basin="atlantic" id="tab-atlantic">Atlantic</button>
      <button type="button" class="basin-tab" role="tab" aria-selected="false"
              data-basin="pacific" id="tab-pacific">Pacific</button>
    </div>
    <p id="subtitle">All years stacked on the same calendar day &amp; 6-hour synoptic time (UTC). Data: NHC HURDAT2.</p>
    <p id="years" class="meta-line" style="margin-top:6px"></p>

    <div class="filter-panel" id="filters">
      <button type="button" id="filter-toggle" aria-expanded="false" aria-controls="filter-body">Filter</button>
      <div id="filter-body" class="filter-body">
        <div class="filter-section">
          <button type="button" class="filter-section-toggle" aria-expanded="false" aria-controls="strength-list">Strength Reached</button>
        <div id="strength-list" class="filter-checks" role="group" aria-label="Strength reached">
          <label><input type="checkbox" name="strength" value="HU5"> Hurricane Cat 5</label>
          <label><input type="checkbox" name="strength" value="HU4"> Hurricane Cat 4</label>
          <label><input type="checkbox" name="strength" value="HU3"> Hurricane Cat 3</label>
          <label><input type="checkbox" name="strength" value="HU2"> Hurricane Cat 2</label>
          <label><input type="checkbox" name="strength" value="HU1"> Hurricane Cat 1</label>
          <label><input type="checkbox" name="strength" value="TS"> Tropical Storm</label>
          <label><input type="checkbox" name="strength" value="TD"> Tropical Depression</label>
          <label><input type="checkbox" name="strength" value="SS"> Subtropical Storm</label>
          <label><input type="checkbox" name="strength" value="SD"> Subtropical Depression</label>
          <label><input type="checkbox" name="strength" value="EX"> Extratropical</label>
          <label><input type="checkbox" name="strength" value="LO"> Low</label>
          <label><input type="checkbox" name="strength" value="DB"> Disturbance</label>
          <label><input type="checkbox" name="strength" value="WV"> Tropical Wave</label>
          <label><input type="checkbox" name="strength" value="OTHER"> Other</label>
        </div>
                </div>
        <div class="filter-section">
          <button type="button" class="filter-section-toggle" aria-expanded="false" aria-controls="only-list">Only Display</button>
        <div id="only-list" class="filter-checks" role="group" aria-label="Only display">
          <label><input type="checkbox" name="only" value="HU5"> Hurricane Cat 5</label>
          <label><input type="checkbox" name="only" value="HU4"> Hurricane Cat 4</label>
          <label><input type="checkbox" name="only" value="HU3"> Hurricane Cat 3</label>
          <label><input type="checkbox" name="only" value="HU2"> Hurricane Cat 2</label>
          <label><input type="checkbox" name="only" value="HU1"> Hurricane Cat 1</label>
          <label><input type="checkbox" name="only" value="TS"> Tropical Storm</label>
          <label><input type="checkbox" name="only" value="TD"> Tropical Depression</label>
          <label><input type="checkbox" name="only" value="SS"> Subtropical Storm</label>
          <label><input type="checkbox" name="only" value="SD"> Subtropical Depression</label>
          <label><input type="checkbox" name="only" value="EX"> Extratropical</label>
          <label><input type="checkbox" name="only" value="LO"> Low</label>
          <label><input type="checkbox" name="only" value="DB"> Disturbance</label>
          <label><input type="checkbox" name="only" value="WV"> Tropical Wave</label>
          <label><input type="checkbox" name="only" value="OTHER"> Other</label>
        </div>
        </div>
        <div class="filter-section">
          <button type="button" class="filter-section-toggle" aria-expanded="false" aria-controls="name-list">Name</button>
          <div id="name-list" class="filter-text">
            <input id="storm-name" type="text" placeholder="e.g. Andrew, Katrina, Camille" aria-label="Storm names, comma-separated" autocomplete="off">
          </div>
        </div>
        <div class="filter-section">
          <button type="button" class="filter-section-toggle" aria-expanded="false" aria-controls="year-list">Years</button>
          <div id="year-list" class="filter-years">
            <label>From <input id="year-from" type="number" inputmode="numeric" aria-label="First year to show"></label>
            <label>To <input id="year-to" type="number" inputmode="numeric" aria-label="Last year to show"></label>
            <label class="year-include">Include <input id="year-list-text" type="text" placeholder="1969, 1992, 2005" aria-label="Years to include" autocomplete="off"></label>
          </div>
        </div>
      </div>
    </div>
  </header>

  <aside id="legend" class="panel legend" aria-label="Status legend"></aside>

  <div class="panel controls" role="group" aria-label="Animation controls">
    <div class="row">
      <div id="datetime" class="datetime">—</div>
      <div id="count" class="meta-line">—</div>
    </div>
    <div class="row">
      <button id="btn-play" class="primary" type="button">Play</button>
      <label class="meta-line" for="speed">Speed</label>
      <select id="speed" aria-label="Animation speed">
        <option value="1000">Slow (1s)</option>
        <option value="500" selected>Normal (0.5s)</option>
        <option value="250">Fast (0.25s)</option>
        <option value="100">Very fast (0.1s)</option>
      </select>
      <label class="meta-line" for="trails">Trails</label>
      <select id="trails" aria-label="Storm trail length">
        <option value="off" selected>Off</option>
        <option value="1">1 day</option>
        <option value="2">2 days</option>
        <option value="3">3 days</option>
        <option value="4">4 days</option>
        <option value="5">5 days</option>
        <option value="6">6 days</option>
        <option value="7">1 week</option>
        <option value="full">Full path</option>
      </select>
      <input id="scrubber" type="range" min="0" max="1" value="0" aria-label="Timeline scrubber" />
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
